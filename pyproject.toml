[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvmd-torch"
version = "0.1.0"
description = "Multivariate Variational Mode Decomposition (MVMD) in PyTorch, on CPU or GPU"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sabrine Bendimerad" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]
keywords = ["mvmd", "vmd", "signal decomposition", "pytorch", "gpu", "meg", "eeg", "time series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
examples = ["matplotlib", "jupyter"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/sbendimerad/mvmd-torch"

[tool.setuptools.packages.find]
where = ["src"]
